[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fastdotcom"]

[project]
name = "fastdotcom"
version = "0.0.7"
description = "Async Python API and CLI for testing internet speed on Fast.com"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Nolan Gilley" },
]
keywords = ["fast.com", "speedtest", "asyncio", "aiohttp", "home-assistant", "network"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Internet",
    "Topic :: System :: Networking :: Monitoring",
    "Typing :: Typed",
]
dependencies = [
    "aiohttp>=3.10.0",
]

[project.urls]
Homepage = "https://github.com/nkgilley/fast.com"
Repository = "https://github.com/nkgilley/fast.com"
Issues = "https://github.com/nkgilley/fast.com/issues"

[project.scripts]
fastdotcom = "fastdotcom.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "pre-commit>=4.0.0",
    "pytest>=9.0.0",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=6.0.0",
    "pytest-timeout>=2.3.0",
    "ruff>=0.11.0",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "ASYNC",
    "B",
    "C4",
    "E",
    "F",
    "I",
    "PT",
    "PTH",
    "RUF",
    "SIM",
    "TC",
    "UP",
    "W",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_configs = true
show_error_codes = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]
addopts = "-vv -m 'not real_api_call' --cov=fastdotcom --cov-branch --cov-report=term-missing"
markers = [
    "real_api_call: Tests making live requests to fast.com (deselected by default)",
]

[tool.coverage.run]
branch = true
source = ["fastdotcom"]

[tool.coverage.report]
fail_under = 95
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
